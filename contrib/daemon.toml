# singbox-board daemon configuration
# Default location: /etc/singbox-board/daemon.toml
# Every key is optional; the values below are the built-in defaults.

# Language of the daemon's own log: "auto" follows the locale (LC_ALL,
# LC_MESSAGES, LANG), otherwise "en" or "zh-CN". Replies to `singbox-board`
# commands and the TUI use the language of the client that sent them.
language = "auto"

# Control socket used by `singbox-board` (TUI / CLI) to talk to the daemon.
socket = "/run/singbox-board/daemon.sock"

# Members of this group may use the control socket in addition to root.
# The socket is chmod 0660 root:<group> when the group exists, 0600 otherwise.
socket_group = "singbox-board"

# Additional user ids that are allowed to use the control socket.
allowed_uids = []

# Number of log lines kept in memory for clients.
log_buffer = 2000

# Echo sing-box output to the daemon's stderr (picked up by journald).
forward_core_logs = true

[core]
# sing-box binary. `singbox-board update` installs it here when missing.
binary = "/usr/local/bin/sing-box"
# Passed as `-c <file>`; relative paths are resolved against `working_dir`.
config = ["/etc/sing-box/config.json"]
# Passed as `-C <dir>`; every *.json file inside is merged by sing-box.
config_dir = []
# Passed as `-D <dir>` (cache.db, rule sets, providers ...).
working_dir = "/var/lib/sing-box"
# Extra arguments appended after `run`.
extra_args = []
# Start sing-box as soon as the daemon starts.
auto_start = true
# Run `sing-box check` before every start and reload.
check_before_start = true
# Seconds to wait after SIGTERM before sending SIGKILL.
stop_timeout_secs = 10

# Extra environment variables for sing-box.
[core.env]
# ENABLE_DEPRECATED_SPECIAL_OUTBOUNDS = "true"

[restart]
# "always", "on-failure" or "never"
policy = "on-failure"
initial_backoff_ms = 1000
max_backoff_secs = 60
# A process that ran this long resets the backoff.
stable_after_secs = 60

# The Clash API endpoint is read from `experimental.clash_api` in the sing-box
# configuration. Set these to override the detected values.
[clash_api]
# url = "http://127.0.0.1:9090"
# secret = ""

# Core downloads. Installed cores are kept in <components.data_dir>/cores and
# core.binary becomes a symlink to the active one (`singbox-board core`, TUI
# tab 6). `update` follows the active core's source and variant; repo and
# variant below only apply while no stored core is active.
[update]
repo = "MiChongs/sing-box"
api_url = "https://api.github.com"
# Build variant, e.g. "ebpf", "v3-glibc", "easytier" (MiChongs) or "glibc", "musl" (SagerNet).
variant = ""
# Override the detected architecture name used in asset names
# (amd64, arm64, armv7 / arm-v7, 386, riscv64, loong64, ...).
# arch = "amd64"
# Include pre-releases (-alpha / -beta / -rc) when looking for the latest one.
prerelease = false
# Proxy used for GitHub requests, e.g. "http://127.0.0.1:7890" or "socks5h://127.0.0.1:1080".
# proxy = ""
# Download mirror prefixed to github.com asset URLs, e.g. "https://ghfast.top/".
# mirror = ""
# Personal access token to raise the GitHub API rate limit.
# github_token = ""
# Restart sing-box after a successful update when it is running.
restart_after_update = true

# ---------------------------------------------------------------------------
# Configuration profiles: every configuration the dashboard manages is kept in
# <components.data_dir>/profiles/, and the first `core.config` file becomes a
# link to the active one. Profiles are imported from files or subscription
# URLs, created from a template, edited and switched in the TUI ("Profiles")
# or with `singbox-board profile`.
# ---------------------------------------------------------------------------
[profiles]
# User-Agent for downloading remote profiles. Empty sends
# "sing-box/<core version>", which providers use to return a sing-box config.
user_agent = ""
# Proxy for downloading remote profiles, e.g. "http://127.0.0.1:7890".
# proxy = ""

# ---------------------------------------------------------------------------
# Optional components. Whether they are enabled is asked on first run (TUI or
# `singbox-board setup`) and stored in <data_dir>/state.json; change it later
# with `singbox-board component <sub-store|http-meta> enable|disable`.
# ---------------------------------------------------------------------------
[components]
data_dir = "/var/lib/singbox-board"
# Node.js used by Sub-Store and http-meta. Unset: `node` from PATH when it is
# v22 or newer, otherwise an LTS build is downloaded into data_dir.
# node = "/usr/bin/node"
node_mirror = "https://nodejs.org/dist"
# Components run as this unprivileged user when the daemon is root.
run_as = "nobody"

[sub_store]
# Frontend and backend share one port; the backend lives under a random secret
# path generated on first enable (see `singbox-board component sub-store`).
host = "127.0.0.1"
port = 3001
backend_repo = "sub-store-org/Sub-Store"
frontend_repo = "sub-store-org/Sub-Store-Front-End"
# sync_cron = "55 23 * * *"
# produce_cron = "0 */2 * * *,sub,a"
# default_proxy = "http://127.0.0.1:7890"

# Extra SUB_STORE_* environment variables. SUB_STORE_CORS_ALLOWED_ORIGINS
# defaults to upstream's list plus the origins the frontend is served on
# (derived from host/port); set it when reaching the UI through a hostname or a
# reverse proxy, e.g. "https://sub.example.com" ("*" allows any origin).
[sub_store.env]

[http_meta]
host = "127.0.0.1"
port = 9876
# authorization = ""
repo = "xream/http-meta"
mihomo_repo = "MetaCubeX/mihomo"
# mihomo_arch = "amd64-v3"

# Extra environment variables (META_MAX_AVAILABLE_PORT, BODY_JSON_LIMIT ...).
[http_meta.env]
