# nfpm configuration for the .deb / .rpm / .apk / Arch Linux packages.
#
# Used by packaging/package.sh (locally and in .github/workflows/release.yml),
# which substitutes @BINARY@ and sets VERSION and ARCH. ARCH uses Go names
# (amd64, arm64, arm7, 386, riscv64, loong64); nfpm maps them to each format.

name: singbox-board
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: "1"
section: net
priority: optional
maintainer: MiChongs <MiChongs@users.noreply.github.com>
vendor: MiChongs
homepage: https://github.com/MiChongs/singbox-board
description: |
  Root daemon and terminal dashboard for MiChongs/sing-box.
  Supervises sing-box (start, stop, crash restart, validated hot reload),
  installs and updates it from GitHub releases, and optionally manages
  Sub-Store and http-meta.

contents:
  - src: "@BINARY@"
    dst: /usr/bin/singbox-board
    file_info:
      mode: 0755

  - src: contrib/daemon.toml
    dst: /etc/singbox-board/daemon.toml
    type: config|noreplace
    file_info:
      mode: 0644

  # systemd everywhere except Alpine, which uses OpenRC.
  - src: contrib/singbox-board.service
    dst: /usr/lib/systemd/system/singbox-board.service
    packager: deb
    file_info:
      mode: 0644
  - src: contrib/singbox-board.service
    dst: /usr/lib/systemd/system/singbox-board.service
    packager: rpm
    file_info:
      mode: 0644
  - src: contrib/singbox-board.service
    dst: /usr/lib/systemd/system/singbox-board.service
    packager: archlinux
    file_info:
      mode: 0644
  - src: contrib/singbox-board.openrc
    dst: /etc/init.d/singbox-board
    packager: apk
    file_info:
      mode: 0755

  # Desktop entry and icon of the system tray (`singbox-board tray`).
  - src: contrib/singbox-board.desktop
    dst: /usr/share/applications/singbox-board.desktop
    file_info:
      mode: 0644
  - src: contrib/singbox-board.svg
    dst: /usr/share/icons/hicolor/scalable/apps/singbox-board.svg
    file_info:
      mode: 0644

  - src: README.md
    dst: /usr/share/doc/singbox-board/README.md
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
