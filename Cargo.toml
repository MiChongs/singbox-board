[package]
name = "singbox-board"
version = "0.1.7"
edition = "2024"
description = "Root daemon and TUI dashboard for MiChongs/sing-box (xiaobaf14g)"
repository = "https://github.com/MiChongs/sing-box"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1.1.10"
futures = "0.3.34"
hex = "0.4.3"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
json_comments = "0.2.2"
jsonc-parser = { version = "0.34", features = ["serde"] }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "optimization", "xz"] }
ksni = "0.3.6"
nix = { version = "0.31.3", features = ["user", "signal", "process", "fs", "net"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
ratatui-textarea = { version = "0.9", default-features = false }
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls-no-provider", "socks", "http2"] }
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-segmentation = "1"
unicode-width = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz", "encoder"] }
